<body>
<div id="ui">

    <option value="group">group of four (two 5-6, two 6-7)</option>

    <option value="g4">four 6-7</option>

</div>
<div id="load">

    <p>Choose or drop <b>scutoid_5-6.stl</b> and <b>scutoid_6-7.stl</b>.</p>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// --- reading the STLs ---------------------------------------------------
// make_scutoids.py writes binary STLs whose header says which piece it is and
// where it sits in its group of four, e.g. "scutoid_5-6 centre=13.5,0"; the
// triangles are stored round the piece's own axis.

function parseStl(buf) {
  const head = new TextDecoder().decode(new Uint8Array(buf, 0, Math.min(80, buf.byteLength)));
  const dv = new DataView(buf);
  const count = buf.byteLength >= 84 ? dv.getUint32(80, true) : 0;
  let pos;
  if (buf.byteLength === 84 + count * 50) {
    pos = new Float32Array(count * 9);
    for (let i = 0; i < count; i++)
      for (let k = 0; k < 9; k++) pos[i * 9 + k] = dv.getFloat32(84 + i * 50 + 12 + k * 4, true);
  } else {
    const text = new TextDecoder().decode(buf);
    const nums = [...text.matchAll(/vertex\s+(\S+)\s+(\S+)\s+(\S+)/g)].flatMap(m => m.slice(1).map(Number));
    if (!nums.length) throw new Error('not an STL file');
    pos = new Float32Array(nums);
  }
  const name = (head.match(/scutoid_(5-6|6-7)/) || [])[1];
  const c = head.match(/centre=([-\d.e]+),([-\d.e]+)/);
  return {name, centre: c ? [+c[1], +c[2]] : null, pos};
}

function addPiece(pieces, buf, fileName) {
  const p = parseStl(buf);
  const name = p.name || (fileName.match(/5-6|6-7/) || [])[0];
  if (!name) throw new Error(`${fileName}: can't tell whether it's the 5-6 or the 6-7`);
  if (!p.centre) throw new Error(`${fileName}: no placement in its header — regenerate it with make_scutoids.py`);
  pieces[name] = p;
}

async function loadPieces() {
  const pieces = {};
  const embedded = JSON.parse(document.getElementById('stls').textContent);
  for (const f of ['scutoid_5-6.stl', 'scutoid_6-7.stl']) {
    if (embedded[f]) {
      addPiece(pieces, Uint8Array.from(atob(embedded[f]), ch => ch.charCodeAt(0)).buffer, f);
      continue;
    }
    // not copied in: read the file itself (only works when served)
    const r = await fetch(f);
    if (!r.ok) throw new Error(`${f}: ${r.status}`);
    addPiece(pieces, await r.arrayBuffer(), f);
  }
  return pieces;
}

const load = document.getElementById('load'), drop = document.getElementById('drop');
const error = document.getElementById('error'), pick = document.getElementById('pick');
let picked = {};
async function takeFiles(files) {
  error.textContent = '';
  try {
    for (const f of files) addPiece(picked, await f.arrayBuffer(), f.name);
  } catch (e) { error.textContent = e.message; return; }
  const missing = ['5-6', '6-7'].filter(n => !picked[n]);
  if (missing.length) { error.textContent = `Still need scutoid_${missing[0]}.stl`; return; }
  load.classList.remove('show');
  start(picked);
}
pick.onchange = () => takeFiles(pick.files);
addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
addEventListener('dragleave', () => drop.classList.remove('over'));
addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); takeFiles(e.dataTransfer.files); });

// --- the scene --------------------------------------------------------------

const r = new THREE.WebGLRenderer({antialias: true});
r.setSize(innerWidth, innerHeight);
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 1, 5000);
cam.up.set(0, 0, 1);
const oc = new OrbitControls(cam, r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(-1, -2, 3);
scene.add(sun);
addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight);
});
(function frame() { requestAnimationFrame(frame); r.render(scene, cam); })();

// 5-6 pink, 6-7 blue; turned-over pieces a darker shade
const COLOURS = {'5-6': [0xe98bb5, 0xb0587f], '6-7': [0xa9c4ec, 0x6f8fc0]};
const sel = document.getElementById('mode'), ex = document.getElementById('ex');
let P, H, items = [];

function start(pieces) {
  P = pieces;
  H = 0;
  for (const n in P) for (let i = 2; i < P[n].pos.length; i += 3) H = Math.max(H, P[n].pos[i]);
  sel.onchange = build;
  ex.oninput = place;
  // settings from the address, e.g. viewer.html?mode=group&apart=0.8&ui=0
  // (mode: layer, group, f4, g4; cam=x,y,z places the camera)
  const q = new URLSearchParams(location.search);
  if (q.get('mode')) sel.value = q.get('mode');
  if (q.get('apart')) ex.value = q.get('apart');
  if (q.get('ui') === '0') document.getElementById('ui').style.display = 'none';
  build();
  if (q.get('cam')) { cam.position.set(...q.get('cam').split(',').map(Number)); oc.update(); }
}

// moves about the junction (x = y = 0, half way up); all are rotations
const upright = p => [-p[0], -p[1], p[2]];                // half a turn about the upright
const flip = p => [p[1], p[0], H - p[2]];                 // about the 45-degree line to V
const flipGroup = p => [-p[0], p[1], H - p[2]];           // a whole group, about its long axis

function add(name, move, turned) {
  const src = P[name], c = src.centre, pos = new Float32Array(src.pos.length);
  for (let i = 0; i < pos.length; i += 3) {
    const q = move([src.pos[i] + c[0], src.pos[i + 1] + c[1], src.pos[i + 2]]);
    pos.set(q, i);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.computeVertexNormals();
  g.computeBoundingBox();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial(
    {color: COLOURS[name][turned ? 1 : 0], flatShading: true, side: THREE.DoubleSide}));
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 1), new THREE.LineBasicMaterial({color: 0x222222})));
  const centre = new THREE.Vector3();
  g.boundingBox.getCenter(centre);
  centre.z = 0;
  m.userData.centre = centre;
  scene.add(m);
  items.push(m);
}

function build() {
  for (const m of items) { scene.remove(m); m.geometry.dispose(); }
  items = [];
  const id = p => p;
  if (sel.value === 'layer') {
    // groups of four on a lattice; (a) is from the 5-6's centre to the 6-7's
    const a = [P['5-6'].centre[0], P['6-7'].centre[1]];
    for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) {
      if (Math.abs(i + j) > 2) continue;
      const dx = 2 * a[0] * (i - j), dy = 2 * a[1] * (i + j), turned = (i + j) % 2 !== 0;
      const at = f => p => { const q = f(turned ? flipGroup(p) : p); return [q[0] + dx, q[1] + dy, q[2]]; };
      for (const n of ['5-6', '6-7']) { add(n, at(id), turned); add(n, at(upright), turned); }
    }
    cam.position.set(-150, -260, 260);
  } else if (sel.value === 'group') {
    add('5-6', id, false);
    add('5-6', upright, false);
    add('6-7', id, false);
    add('6-7', upright, false);
    cam.position.set(-110, -140, 110);
  } else {
    const n = sel.value === 'f4' ? '5-6' : '6-7';
    add(n, id, false);
    add(n, upright, false);
    add(n, flip, true);
    add(n, p => upright(flip(p)), true);
    cam.position.set(-110, -140, 110);
  }
  oc.target.set(0, 0, H / 2);
  oc.update();
  place();
}

function place() {
  const mid = new THREE.Vector3();
  for (const m of items) mid.add(m.userData.centre);
  mid.divideScalar(items.length);
  for (const m of items) m.position.copy(m.userData.centre).sub(mid).multiplyScalar(ex.value * 0.5);
}

loadPieces().then(start, () => load.classList.add('show'));
</script>
</body>
